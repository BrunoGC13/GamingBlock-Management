name: main

on:
  push:
    branches:
      - main

  workflow_dispatch:
  
jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: write 

    steps:
      - uses: actions/checkout@v4

      - name: Update & Install Java
        run: |
          sudo apt update -y
          sudo apt upgrade -y
          sudo apt install openjdk-21-jre openjdk-21-jdk -y

      - name: Run the dev build script
        run: |
          sudo chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release Build #${{ github.run_number }} 
          tag_name: b${{ github.run_number }}
          generate_release_notes: true 
          draft: false
          prerelease: false
          files: |
            build/libs/*.jar
